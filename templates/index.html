<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟鼠标控制系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            color: #1e293b;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            color: #1e293b;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            color: #1e293b;
            font-weight: 600;
        }

        .header p {
            font-size: 0.95rem;
            color: #64748b;
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .video-section, .control-section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .section-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #4a5568;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 380px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #888;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .video-placeholder p {
            margin: 0;
            width: 100%;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .status-label {
            font-weight: 500;
            color: #374151;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #dc2626;
        }

        .status-dot.active {
            background: #059669;
            box-shadow: 0 0 6px rgba(5, 150, 105, 0.4);
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
        }

        .btn-start {
            background: #3b82f6;
            color: white;
        }

        .btn-start:hover {
            background: #2563eb;
        }

        .btn-stop {
            background: #64748b;
            color: white;
        }

        .btn-stop:hover {
            background: #475569;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .gesture-tips {
            background: white;
            border-radius: 8px;
            padding: 18px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }

        .tips-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .tip-item {
            background: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #3b82f6;
        }

        .tip-title {
            font-weight: 600;
            color: #1e293b;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .tip-desc {
            color: #64748b;
            font-size: 0.8rem;
            line-height: 1.3;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f4f6;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.7rem;
            }
            
            .tips-grid {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>虚拟鼠标控制</h1>
            <p>右手即可控制</p>
        </div>

        <div class="main-content">
            <div class="video-section">
                <h2 class="section-title">摄像头画面</h2>
                <div class="video-container">
                    <img id="videoFeed" class="video-feed" src="" alt="摄像头">
                    <div id="videoPlaceholder" class="video-placeholder">
                        <p>点击"启动"开始使用</p>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h2 class="section-title">运行状态</h2>
                <div class="control-panel">
                    <div class="status-item">
                        <span class="status-label">摄像头</span>
                        <span id="cameraStatus" class="status-dot"></span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">手势识别</span>
                        <span id="handStatus" class="status-dot"></span>
                    </div>
                    <div class="status-item">
                        <span class="status-label">鼠标控制</span>
                        <span id="mouseStatus" class="status-dot"></span>
                    </div>
                </div>

                <div class="controls">
                    <button id="startBtn" class="btn btn-start">启动</button>
                    <button id="stopBtn" class="btn btn-stop" disabled>停止</button>
                </div>
            </div>
        </div>

        <div class="gesture-tips">
            <h2 class="section-title">手势说明</h2>
            <div class="tips-grid">
                <div class="tip-item">
                    <div class="tip-title">移动光标</div>
                    <div class="tip-desc">伸出食指移动</div>
                </div>
                <div class="tip-item">
                    <div class="tip-title">左键点击</div>
                    <div class="tip-desc">拇指食指捏合（只有检测到伸出两根手指时才会调用点击操作）（为防误触可以伸出拇指中指食指三根手指）</div>
                </div>
                <div class="tip-item">
                    <div class="tip-title">右键点击</div>
                    <div class="tip-desc">食指中指捏合（只有检测到伸出两根手指时才会调用点击操作）（为防误触可以伸出拇指中指食指三根手指）</div>
                </div>
                <div class="tip-item">
                    <div class="tip-title">向上滚动</div>
                    <div class="tip-desc">伸出三根手指（可以通过弯曲来控制滚动速度）</div>
                </div>
                <div class="tip-item">
                    <div class="tip-title">向下滚动</div>
                    <div class="tip-desc">伸出四根手指（可以通过弯曲来控制滚动速度）</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let statusTimer;

        const elements = {
            startBtn: document.getElementById('startBtn'),
            stopBtn: document.getElementById('stopBtn'),
            videoFeed: document.getElementById('videoFeed'),
            videoPlaceholder: document.getElementById('videoPlaceholder'),
            cameraStatus: document.getElementById('cameraStatus'),
            handStatus: document.getElementById('handStatus'),
            mouseStatus: document.getElementById('mouseStatus')
        };

        // 启动系统
        elements.startBtn.addEventListener('click', async () => {
            elements.startBtn.disabled = true;
            elements.startBtn.innerHTML = '<div class="loading"></div> 启动中';

            try {
                const response = await fetch('/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'start' })
                });

                const data = await response.json();

                if (data.success) {
                    isRunning = true;
                    elements.videoFeed.src = '/video_feed';
                    elements.videoPlaceholder.style.display = 'none';
                    elements.stopBtn.disabled = false;
                    elements.startBtn.innerHTML = '运行中';
                    
                    statusTimer = setInterval(updateStatus, 1000);
                    showMessage('系统已启动', 'success');
                } else {
                    elements.startBtn.disabled = false;
                    elements.startBtn.innerHTML = '启动';
                    showMessage('启动失败: ' + data.message, 'error');
                }
            } catch (error) {
                elements.startBtn.disabled = false;
                elements.startBtn.innerHTML = '启动';
                showMessage('连接失败', 'error');
            }
        });

        // 停止系统
        elements.stopBtn.addEventListener('click', async () => {
            elements.stopBtn.disabled = true;
            elements.stopBtn.innerHTML = '<div class="loading"></div> 停止中';

            try {
                const response = await fetch('/control', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'stop' })
                });

                const data = await response.json();

                if (data.success) {
                    isRunning = false;
                    elements.videoFeed.src = '';
                    elements.videoPlaceholder.style.display = 'flex';
                    elements.startBtn.disabled = false;
                    elements.startBtn.innerHTML = '启动';
                    elements.stopBtn.innerHTML = '停止';
                    
                    clearInterval(statusTimer);
                    resetStatus();
                    showMessage('系统已停止', 'info');
                }
            } catch (error) {
                elements.stopBtn.disabled = false;
                elements.stopBtn.innerHTML = '停止';
                showMessage('停止失败', 'error');
            }
        });

        // 更新状态
        async function updateStatus() {
            try {
                const response = await fetch('/status');
                const status = await response.json();

                updateDot(elements.cameraStatus, status.camera_connected);
                updateDot(elements.handStatus, status.hand_detection_active);
                updateDot(elements.mouseStatus, status.mouse_control_active);

            } catch (error) {
                console.error('状态更新失败:', error);
            }
        }

        function updateDot(element, isActive) {
            if (isActive) {
                element.classList.add('active');
            } else {
                element.classList.remove('active');
            }
        }

        function resetStatus() {
            updateDot(elements.cameraStatus, false);
            updateDot(elements.handStatus, false);
            updateDot(elements.mouseStatus, false);
        }

        function showMessage(text, type) {
            const msg = document.createElement('div');
            msg.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 10px 15px;
                border-radius: 6px;
                color: white;
                font-weight: 500;
                z-index: 1000;
                transform: translateX(100%);
                transition: transform 0.3s ease;
                font-size: 0.9rem;
            `;

            const colors = {
                success: '#3b82f6',
                error: '#64748b',
                info: '#64748b'
            };
            msg.style.background = colors[type] || colors.info;
            msg.textContent = text;

            document.body.appendChild(msg);

            setTimeout(() => msg.style.transform = 'translateX(0)', 100);
            setTimeout(() => {
                msg.style.transform = 'translateX(100%)';
                setTimeout(() => document.body.removeChild(msg), 300);
            }, 2000);
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            showMessage('系统已就绪', 'info');
        });
    </script>
</body>
</html>
